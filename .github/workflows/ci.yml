name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (firmware logic + host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Protocol vectors are up to date
        run: python3 tools/gen_vectors.py --check
      - name: Analytical budget matches the DPR (Table X)
        run: python3 tools/lora_budget.py --check
      - name: Firmware unit tests (gcc, host)
        run: make -C firmware/test
      - name: Host dependencies
        run: pip install -r host/requirements-dev.txt
      - name: Host tests
        run: cd host && python -m pytest -q

  firmware:
    name: ESP-IDF build (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [firmware/node/v1.0, firmware/gateway]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe -> firmware version string
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.3
          target: esp32
          path: ${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project == 'firmware/gateway' && 'gateway' || 'node-v1.0' }}-bin
          path: |
            ${{ matrix.project }}/build/*.bin
            ${{ matrix.project }}/build/bootloader/bootloader.bin
            ${{ matrix.project }}/build/partition_table/partition-table.bin
            ${{ matrix.project }}/build/flasher_args.json

  arduino-v01:
    name: Arduino build (firmware v0.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: |
            - firmware/node/v0.1/main
